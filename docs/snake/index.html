<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake: Loop de Precisión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>SNAKE</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Nivel</span>
                    <span class="value" id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label">Pasos</span>
                    <span class="value" id="steps">0</span>
                </div>
                <div class="stat">
                    <span class="label">Manzanas</span>
                    <span class="value" id="apples">0</span>
                </div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-info">
            <p id="message">Movimiento automático. Usa flechas o WASD para girar</p>
            <p class="small-text">Sin crecer. Reinicia el nivel al perder, no el juego.</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
